name: iOS build (cloud Mac)

on:
  push:
    branches: [cloud-ios-build]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || true
          xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          brew install cmake git-lfs || true
          git lfs install
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install mlc-llm (prebuilt nightly)
        # NOTE: on macos-15 pip resolves a broken mix (mlc-llm 0.20.dev162 macosx_13_0
        # + mlc-ai 0.26.dev203 macosx_15_0 -> missing @rpath/libtvm.dylib), and the
        # v0.9.dev0 macosx_15_0 pair has an ABI skew (missing tvm::ffi::json::Stringify).
        # macos-26 gets the current matched nightly pair (0.26.x, macosx_26_0).
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip
          python -m pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cpu mlc-ai-nightly-cpu
          pip show apache-tvm-ffi | head -2
          python -c "import tvm; print('tvm import ok')"
          # The nightly's desktop native lib (libmlc_llm_module.dylib) aborts on
          # dlopen (SIGABRT); `mlc_llm package` only needs the TVM compiler +
          # Python orchestration, so skip loading the native lib.
          SKIP_LOADING_MLCLLM_SO=1 python -c "import mlc_llm; print('mlc_llm', mlc_llm.__version__)"
          SKIP_LOADING_MLCLLM_SO=1 python -m mlc_llm package --help | head -25

      - name: Trim model list to one small model
        run: |
          cd ios/MLCChat
          cp mlc-package-config.json mlc-package-config.json.bak
          cat > mlc-package-config.json << 'JSON'
          {
              "device": "iphone",
              "model_list": [
                  {
                      "model": "HF://mlc-ai/Qwen3-0.6B-q0f16-MLC",
                      "model_id": "Qwen3-0.6B-q0f16",
                      "estimated_vram_bytes": 2000000000,
                      "overrides": {
                          "prefill_chunk_size": 128,
                          "context_window_size": 2048
                      }
                  }
              ]
          }
          JSON
          cat mlc-package-config.json

      - name: Package (compile model + build runtime libs)
        run: |
          cd ios/MLCChat
          export MLC_LLM_SOURCE_DIR="$GITHUB_WORKSPACE"
          export PATH="$HOME/.cargo/bin:$PATH"
          python -m mlc_llm package
        env:
          MLC_JIT_POLICY: REDO
          SKIP_LOADING_MLCLLM_SO: "1"

      - name: Verify dist layout
        run: |
          find ios/MLCChat/dist -maxdepth 3 | head -30
          ls -la ios/MLCChat/dist/lib/

      - name: Build iOS app (unsigned validation build)
        run: |
          cd ios/MLCChat
          xcodebuild \
            -project MLCChat.xcodeproj \
            -scheme MLCChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLCChat-unsigned
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/MLCChat.app
