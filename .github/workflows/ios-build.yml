name: iOS build (cloud Mac)

on:
  push:
    branches: [cloud-ios-build]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cloud-ios-build
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          for xc in /Applications/Xcode_26.6.app /Applications/Xcode_26.app /Applications/Xcode.app; do
            if [ -d "$xc/Contents/Developer" ]; then
              echo "Using $xc"
              sudo xcode-select -s "$xc/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install cmake git-lfs rust 2>/dev/null || true
          git lfs install || true
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version || true

      - name: Build iOS runtime libs
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash ios/prepare_libs.sh 2>&1 | tail -30
          echo "=== Built libs ==="
          ls -lh build/lib/

      - name: Build unsigned iOS app
        run: |
          cd ios/MLCChat
          xcodebuild -project MLCChat.xcodeproj -scheme MLCChat \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/derived-data 2>&1 | tail -50

      - name: Upload unsigned app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MLCChat-unsigned
          path: /tmp/derived-data/Build/Products/Release-iphoneos/MLCChat.app
