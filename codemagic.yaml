workflows:
  mlcchat-testflight:
    name: MLCChat TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.e5enclave.mlcchat
        XCODE_PROJECT: ios/MLCChat/MLCChat.xcodeproj
        XCODE_SCHEME: MLCChat
      xcode: latest
    scripts:
      - name: Init submodules and LFS
        script: |
          git submodule update --init --recursive
          git lfs install
          git lfs pull
      - name: Install build dependencies
        script: |
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
          if ! command -v git-lfs >/dev/null 2>&1; then brew install git-lfs; fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Generate distribution signing key
        script: |
          openssl genrsa -out dist-signing.key 2048
          echo "signing key ready"
      - name: Register bundle ID if missing
        script: |
          app-store-connect bundle-ids create "$BUNDLE_ID" --name "MLCChat" || echo "Bundle ID already registered"
      - name: Ensure App Store Connect app record
        script: |
          python3 -m pip install --quiet "pyjwt[crypto]" || true
          python3 - <<'PYEOF'
          import os, time, json, urllib.request, urllib.parse, urllib.error
          import jwt
          for v in ["APP_STORE_CONNECT_KEY_IDENTIFIER",
                    "APP_STORE_CONNECT_ISSUER_ID",
                    "APP_STORE_CONNECT_PRIVATE_KEY"]:
              assert v in os.environ and os.environ[v], "missing env var: %s" % v
          key_id = os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]
          issuer_id = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          priv = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"]
          BUNDLE = os.environ["BUNDLE_ID"]
          token = jwt.encode(
              {"iss": issuer_id, "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
              priv, algorithm="ES256", headers={"kid": key_id})
          def call(method, path, params=None, data=None):
              url = "https://api.appstoreconnect.apple.com" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header("Authorization", "Bearer " + token)
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
          s, apps = call("GET", "/v1/apps", {"filter[bundleId]": BUNDLE})
          assert s == 200, "apps lookup failed: %s" % s
          if apps.get("data"):
              print("app record exists:", apps["data"][0]["id"])
          else:
              s, bids = call("GET", "/v1/bundleIds", {"filter[identifier]": BUNDLE})
              assert s == 200 and bids.get("data"), "bundleId lookup failed: %s" % s
              bid = bids["data"][0]["id"]
              payload = {"data": {"type": "apps",
                  "attributes": {"bundleId": BUNDLE, "name": "MLCChat",
                                 "primaryLocale": "en-US", "sku": "mlcchat-001"},
                  "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bid}}}}}
              s, res = call("POST", "/v1/apps", data=payload)
              assert s in (200, 201), "app create failed: %s" % s
              print("app record created")
          PYEOF
      - name: Fetch signing files (creates App Store profile if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:dist-signing.key \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Apply provisioning profiles to Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS runtime libs
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash ios/prepare_libs.sh
          ls -lh build/lib/
      - name: Verify bundle ID
        script: |
          grep "PRODUCT_BUNDLE_IDENTIFIER" ios/MLCChat/MLCChat.xcodeproj/project.pbxproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
  mlcchat-postflight:
    name: MLCChat post-upload compliance
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.e5enclave.mlcchat
      xcode: latest
    scripts:
      - name: Export compliance and beta group
        script: |
          python3 -m pip install --quiet "pyjwt[crypto]" || echo "pip install failed, continuing"
          python3 - <<'PYEOF'
          import os, time, json, urllib.request, urllib.parse, urllib.error
          import jwt
          key_id = os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]
          issuer_id = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          priv = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"]
          BUNDLE = os.environ["BUNDLE_ID"]
          def mint():
              return jwt.encode(
                  {"iss": issuer_id, "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
                  priv, algorithm="ES256", headers={"kid": key_id})
          token = mint()
          def call(method, path, params=None, data=None):
              global token
              url = "https://api.appstoreconnect.apple.com" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header("Authorization", "Bearer " + token)
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:800]
          s, apps = call("GET", "/v1/apps", {"filter[bundleId]": BUNDLE})
          assert s == 200 and apps.get("data"), "app not found: %s %s" % (s, apps)
          app_id = apps["data"][0]["id"]
          print("app:", app_id)
          s, builds = call("GET", "/v1/builds",
                           {"filter[app]": app_id, "sort": "-uploadedDate", "limit": "1"})
          assert s == 200 and builds.get("data"), "no builds yet: %s %s" % (s, builds)
          build = builds["data"][0]
          print("build:", build["id"], build["attributes"].get("version"))
          bundle_id = None
          for i in range(30):
              if i and i % 6 == 0:
                  token = mint()
              s, bb = call("GET", "/v1/builds/%s/buildBundles" % build["id"])
              if s == 200 and bb.get("data"):
                  bundle_id = bb["data"][0]["id"]
                  break
              print("waiting for Apple processing... (%d)" % i, flush=True)
              time.sleep(60)
          assert bundle_id, "build never finished processing"
          s, res = call("PATCH", "/v1/buildBundles/%s" % bundle_id,
                        data={"data": {"type": "buildBundles", "id": bundle_id,
                                       "attributes": {"usesNonExemptEncryption": False}}})
          assert s == 200, "compliance update failed: %s %s" % (s, res)
          print("export compliance set: usesNonExemptEncryption=false")
          s, groups = call("GET", "/v1/apps/%s/betaGroups" % app_id)
          gid = None
          if s == 200:
              for g in groups.get("data", []):
                  if g["attributes"].get("name") == "E5 Internal":
                      gid = g["id"]
          if not gid:
              payload = {"data": {"type": "betaGroups",
                  "attributes": {"name": "E5 Internal", "isInternalGroup": True},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}}
              s, res = call("POST", "/v1/betaGroups", data=payload)
              assert s in (200, 201), "beta group create failed: %s %s" % (s, res)
              gid = res["data"]["id"]
              print("beta group created:", gid)
          else:
              print("beta group exists:", gid)
          s, res = call("POST", "/v1/betaGroups/%s/relationships/builds" % gid,
                        data={"data": [{"type": "builds", "id": build["id"]}]})
          print("build assigned to group:", s)
          s, users = call("GET", "/v1/users", {"filter[username]": "regallion305@outlook.com"})
          if s == 200 and users.get("data"):
              uid = users["data"][0]["id"]
              s2, bt = call("POST", "/v1/betaTesters",
                            data={"data": {"type": "betaTesters",
                                           "relationships": {"user": {"data": {"type": "users", "id": uid}}}}})
              if s2 in (200, 201):
                  btid = bt["data"]["id"]
              else:
                  s3, lst = call("GET", "/v1/betaTesters", {"filter[user]": uid, "limit": "1"})
                  btid = lst["data"][0]["id"] if s3 == 200 and lst.get("data") else None
              if btid:
                  s4, _ = call("POST", "/v1/betaGroups/%s/relationships/betaTesters" % gid,
                               data={"data": [{"type": "betaTesters", "id": btid}]})
                  print("tester added to group:", s4)
              else:
                  print("tester lookup failed, skipping")
          else:
              print("user not found, skipping tester add")
          print("postflight done")
          PYEOF
